name: Server container

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yapshire-server:test
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check non-root image, maps, password and two clients
        run: python tools/check_container.py yapshire-server:test

  publish:
    if: inputs.publish
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-server"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$RELEASE_TAG"
            echo "$image:sha-$REVISION"
            newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            if [ "$newest" = "$RELEASE_TAG" ]; then echo "$image:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 image
        id: published
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Verify published image on both architectures
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > published-index.json
          # The classic Docker image store cannot hold two architectures under
          # the same index digest. Pull each platform's immutable manifest.
          for architecture in amd64 arm64; do
            manifest=$(jq -er --arg architecture "$architecture" '
              .manifests[] | select(.platform.os == "linux" and
                .platform.architecture == $architecture) | .digest
            ' published-index.json)
            python tools/check_container.py "$IMAGE@$manifest" --platform "linux/$architecture"
          done
